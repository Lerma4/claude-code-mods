<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storico sessioni</title>
<style>
:root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --dim: #8b949e; --edit: #f0883e; --write: #3fb950; --accent: #d97757; --read: #58a6ff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 15px; color: var(--accent); }
input, select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
input { flex: 1; min-width: 180px; max-width: 420px; }
.dim { color: var(--dim); }
main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
.day { color: var(--dim); margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.s { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 8px; }
.s > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: baseline; }
.s > summary::-webkit-details-marker { display: none; }
.s[open] > summary { border-bottom: 1px solid var(--line); }
.t { font: 12px Consolas, monospace; color: var(--dim); }
.proj { font-weight: 600; }
.prompt { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { padding: 1px 7px; border: 1px solid var(--line); border-radius: 10px; color: var(--dim); font-size: 12px; white-space: nowrap; }
.files { padding: 8px 12px 10px; }
.f { display: grid; grid-template-columns: 1fr auto 90px; gap: 10px; padding: 3px 0; align-items: center; }
.f .p { font: 12px Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.bar { height: 4px; border-radius: 2px; background: var(--edit); }
a { color: var(--read); }
.empty { color: var(--dim); text-align: center; padding: 40px; }
mark { background: #6e4a1e; color: inherit; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>📚 Storico sessioni</h1>
  <input id="q" placeholder="Cerca file, progetto o richiesta…" autofocus>
  <select id="proj"><option value="">Tutti i progetti</option></select>
  <span class="dim" id="count"></span>
</header>
<main id="list"><div class="empty">Caricamento…</div></main>
<script>
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const base = p => p.replace(/\\/g, '/').split('/').filter(Boolean).pop() || p
const dur = ms => ms < 60000 ? `${Math.round(ms / 1000)}s` : ms < 3600000 ? `${Math.round(ms / 60000)}m` : `${(ms / 3600000).toFixed(1)}h`
let ROWS = []
const open = new Set()

window.__STORICO = rows => {
  ROWS = rows.sort((a, b) => b.updated - a.updated)
  const projects = [...new Set(ROWS.map(r => r.project))].sort()
  const cur = $('proj').value
  $('proj').innerHTML = '<option value="">Tutti i progetti</option>' + projects.map(p => `<option value="${esc(p)}">${esc(base(p))}</option>`).join('')
  $('proj').value = cur
  draw()
}
// Re-read every few seconds so the running session's row stays fresh.
function poll() { const s = document.createElement('script'); s.src = 'storico.js?' + Date.now(); s.onload = s.onerror = () => s.remove(); document.body.appendChild(s) }
setInterval(poll, 5000); poll()

function hl(text, q) {
  const t = esc(text); if (!q) return t
  const i = text.toLowerCase().indexOf(q); if (i < 0) return t
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length))
}

function draw() {
  const q = $('q').value.trim().toLowerCase(), proj = $('proj').value
  const rows = ROWS.filter(r => (!proj || r.project === proj) && (!q || r.project.toLowerCase().includes(q) || (r.prompt || '').toLowerCase().includes(q) || r.files.some(f => f.path.toLowerCase().includes(q))))
  $('count').textContent = `${rows.length} sessioni`
  if (!rows.length) { $('list').innerHTML = `<div class="empty">${ROWS.length ? 'Nessuna sessione corrisponde.' : 'Ancora nessuna sessione registrata.'}</div>`; return }
  let day = '', h = ''
  for (const r of rows) {
    const d = new Date(r.start).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    if (d !== day) { day = d; h += `<div class="day">${d}</div>` }
    const max = r.files[0]?.score || 1
    // A search for a file opens the sessions that touched it.
    const isOpen = open.has(r.id) || (q && r.files.some(f => f.path.toLowerCase().includes(q)))
    h += `<details class="s" data-id="${esc(r.id)}" ${isOpen ? 'open' : ''}><summary>
      <span class="t">${new Date(r.start).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</span>
      <span><span class="proj" title="${esc(r.project)}">${hl(base(r.project), q)}</span> <span class="prompt">${r.prompt ? '· ' + hl(r.prompt, q) : ''}</span></span>
      <span class="meta"><span class="chip">✏️ ${r.files.length} file</span><span class="chip">🤖 ${r.agents} agenti</span><span class="chip">${r.calls} chiamate</span><span class="chip">⏱ ${dur(r.updated - r.start)}</span>
      ${r.detail ? `<a class="chip" style="color:var(--read)" href="sessioni/${encodeURIComponent(r.id)}/index.html">apri flusso →</a>` : '<span class="chip" title="Il dettaglio è stato cancellato: resta solo la lista dei file">solo file</span>'}</span>
    </summary><div class="files">${r.files.length ? r.files.map(f => `<div class="f"><span class="p" title="${esc(f.path)}">${hl(f.path, q)}</span>
      <span>${f.edits ? `<span style="color:var(--edit)">E${f.edits}</span> ` : ''}${f.writes ? `<span style="color:var(--write)">W${f.writes}</span>` : ''}</span>
      <div class="bar" style="width:${Math.max(6, 100 * f.score / max)}%"></div></div>`).join('') : '<span class="dim">Nessun file modificato.</span>'}</div></details>`
  }
  $('list').innerHTML = h
}
$('q').oninput = draw
$('proj').onchange = draw
$('list').addEventListener('toggle', ev => { const d = ev.target; if (d.dataset?.id) d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id) }, true)
</script>
</body>
</html>
